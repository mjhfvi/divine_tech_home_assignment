  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        name: bandit (security linter in Python code)
        # args: ["-s", ""]

  - repo: https://github.com/PeterMosmans/jenkinslint
    rev: v1.0.0
    hooks:
      - id: jenkinslint
        name: jenkinslint (basic Jenkinsfile linter)

  # - repo: https://github.com/terraform-docs/terraform-docs
  #   rev: v0.19.0
  #   hooks:
  #     - id: terraform-docs-go
  #       args: [markdown, table, --output-file, README.md, ./]
  #       args: [--args=--config=.terraform-docs.yml]

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.2
    hooks:
      - id: terraform_fmt
        verbose: true
        # args: [--hook-config=--parallelism-ci-cpu-cores=1]
      - id: terraform_tflint
        verbose: true
      # args: [--minimum-failure-severity=[notice,warning]]
      # args: [--hook-config=--parallelism-ci-cpu-cores=1]
      - id: terraform_validate
        verbose: true
      - id: terraform_trivy
        verbose: true
      # files: ^prd-infra/
      - id: terraform_providers_lock
        verbose: true
        # args: [--hook-config=--parallelism-limit=CPU*4]
      # - id: terraform_checkov
      #   verbose: true
      #   args: ["--config-file", ".checkov.yaml"]
        # args: [--args=--quiet, --args=--skip-check CKV2_AWS_8]
      # - id: infracost_breakdown
      #   args:
      #     - --args=--path=./terraform
      #   verbose: true

  - repo: https://github.com/pryorda/dockerfilelint-precommit-hooks
    rev: v0.1.0
    hooks:
      - id: dockerfilelint
        name: dockerfilelint-precommit-hooks (Useful pre-commit hooks for checking Dockerfiles)
        stages: [pre-commit]

  - repo: https://github.com/hadolint/hadolint
    rev: v2.15.1
    hooks:
      - id: hadolint
        name: Lint Dockerfiles
        description: Runs hadolint to lint Dockerfiles
        language: system
        types: ["dockerfile"]
        entry: hadolint
        args:
          [
            "--ignore",
            "DL3007",
            "--ignore",
            "DL3013",
            "--ignore",
            "DL3027",
            "--ignore",
            "DL3059",
            "--ignore",
            "DL4006",
            "--ignore",
            "SC1091",
            "--ignore",
            "SC2015",
            "--ignore",
            "SC3037",
          ]

  # - repo: https://github.com/dmitri-lerko/pre-commit-docker-kustomize
  #   rev: f3a8533
  #   hooks:
  #       - id: kustomize
  #         name: kustomize-development
  #         description: pre-commit hook which runs kustomize docker image
  #         args: [overlays/development]
  #         verbose: false

  - repo: https://github.com/zwennesm/pre-commit-k8s
    rev: 0.0.3
    hooks:
      - id: pre-commit-k8s
        entry: pre-commit-k8s
        exclude: postgresql-secret.yaml|jenkins-secret.yaml

  - repo: https://github.com/stackrox/kube-linter
    rev: v0.8.3 # kube-linter version
    hooks:
      - id: kube-linter
        name: kube-linter (static analysis tool for Kubernetes YAML files)
        args: [-v]
        files: .yaml$
        # exclude:

  - repo: https://github.com/norwoodj/helm-docs
    rev: v1.14.2
    hooks:
      - id: helm-docs
        name: helm-docs (auto-generates documentation from helm charts into markdown)
        # exclude:

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        name: detect-secrets (module for detecting secrets)
        args:
          - --baseline
          - .secrets.baseline
          - --disable-plugin
          - KeywordDetector
        # exclude:

  - repo: https://github.com/zricethezav/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
        name: gitleaks
        description: Gitleaks is for detecting and preventing hardcoded secrets
        args: [--no-banner, --config=.gitleaks.toml]
        exclude: .secrets.baseline

  - repo: https://github.com/thoughtworks/talisman
    rev: v1.37.0
    hooks:
      - id: talisman-commit
        name: talisman (scans git to ensure that potential secrets or sensitive information)
        entry: cmd --githook pre-commit

