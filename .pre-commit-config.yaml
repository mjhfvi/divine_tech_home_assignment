---
# Source: https://pre-commit.com/hooks.html
# pre-commit install
# pre-commit autoupdate
# pre-commit run --all-files --verbose
# detect-secrets scan > .secrets.baseline
# safety auth login
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    # name: pre-commit-hooks (out-of-the-box hooks for pre-commit)
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        description: Trims trailing whitespace.
      - id: end-of-file-fixer
        description: Makes sure files end in a newline and only a newline.
        # exclude: .cache_ggshield
      - id: double-quote-string-fixer
        verbose: true
      - id: debug-statements
        verbose: true
      - id: name-tests-test
        verbose: true
      - id: requirements-txt-fixer
        verbose: true
      - id: check-added-large-files
        args: [--maxkb=10000]
        verbose: true
        log_file: "true"
      - id: check-ast
        verbose: true
      - id: check-builtin-literals
        verbose: true
      - id: check-xml
        verbose: true
      - id: check-yaml
        verbose: true
        args: [--allow-multiple-documents]
        exclude: .pre-commit-config.yaml | */values.yaml
      - id: pretty-format-json
        verbose: true
        args: [--autofix]
        exclude: '^.vscode/'
      - id: check-json
        verbose: true
        exclude: '^.vscode/'
      - id: check-merge-conflict
        verbose: true
      - id: check-vcs-permalinks
        verbose: true
        exclude:  .pre-commit-config.yaml | */values.yaml
      - id: forbid-new-submodules
        verbose: true
      - id: no-commit-to-branch
        verbose: true
        args: [--branch, master]
      - id: check-executables-have-shebangs
        verbose: true
      - id: mixed-line-ending
        verbose: true
        args: [--fix=lf]
      - id: detect-aws-credentials
        verbose: true
        args: ['--allow-missing-credentials']
      - id: detect-private-key
        verbose: true
        exclude: gitleaks-report.json

  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.6
    hooks:
      - id: forbid-crlf
        name: pre-commit-hooks (Lucas-C - useful git hooks)
        verbose: true
      - id: remove-crlf
        description: Remove CRLF Line breaks
        exclude: .pre-commit-config.yaml
      - id: forbid-tabs
        verbose: true
      - id: remove-tabs
        name: pre-commit-hooks (Lucas-C - useful git hooks)
        verbose: true
        args: [--whitespaces-count, "2"] # defaults to: 4

  - repo: https://github.com/asottile/setup-cfg-fmt
    rev: v3.2.0
    hooks:
      - id: setup-cfg-fmt
        name: setup-cfg-fmt (apply a consistent format to setup.cfg files)

  - repo: https://github.com/jumanjihouse/pre-commit-hooks
    rev: 3.0.0
    hooks:
      - id: shfmt
        args: [-l, -i, "2", -ci, -sr, -w]
        verbose: true
      - id: shellcheck
        verbose: true

  - repo: https://github.com/crate-ci/typos
    rev: v1.50.3
    hooks:
      - id: typos
        name: typos (Finds and corrects spelling mistakes)
        args: ["--config", ".typos.toml", "-v"]
        exclude: gitleaks-report.json|values\.yaml|jenkins/example-values-jenkins.yaml

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        # https://prettier.io/docs/en/options.html#parser
        files: .json5$

  - repo: https://github.com/lyz-code/yamlfix/
    rev: 1.19.1
    hooks:
      - id: yamlfix
        exclude: .pre-commit-config.yaml|values\.yaml

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        name: yamllint (linter for YAML files)
        args: [--format, auto]
        exclude: .pre-commit-config.yaml|values\.yaml

