name: Reusable Docker Image Build and Push to Azure Container

on:
  push:
    # branches: [main]
  workflow_call:
    inputs:
      ACR_NAME:
        description: 'Azure Container Registry name (without .azurecr.io)'
        required: true
        type: string
      IMAGE_NAME:
        description: 'Docker image name'
        required: true
        type: string
      RESOURCE_GROUP:
        description: 'Azure Resource Group name'
        required: true
        type: string
      CONTAINER_APP_NAME:
        description: 'Azure Container App name'
        required: true
        type: string
    # outputs:
    #   image:
    #     description: 'The built image reference'
    #     value: ${{ jobs.build.outputs.image }}
  workflow_dispatch:

# Required for OIDC, GitHub-signed ID token
permissions:
  id-token: write
  contents: read

env:
  ACR_NAME: ${{ vars.ACR_NAME }}
  IMAGE_NAME: ${{ vars.IMAGE_NAME }}
  RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
  CONTAINER_APP_NAME: ${{ vars.CONTAINER_APP_NAME }}

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    environment: production
    # outputs:
    #   image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login - OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          allow-no-subscriptions: true

      - name: Log in to Azure Container Registry
        id: acr_token
        run: |
          TOKEN=$(az acr login --name yourregistryname --expose-token --output tsv --query accessToken)
          echo "ACR_TOKEN=$TOKEN" >> $GITHUB_ENV
      
      # - name: Docker Login
      #   uses: docker/login-action@v3
      #   with:
      #     registry: divinehomeassignmentcontainerregistrydev.azurecr.io
      #     username: 00000000-0000-0000-0000-000000000000
      #     password: ${{ env.ACR_TOKEN }}
      
      - name: Login to ACR
        run: |
              az account set --subscription ${{ secrets.AZURE_SUBSCRIPTION_ID }}
              az acr check-health --name ${{ vars.ACR_NAME }} --ignore-errors --yes
              az acr login --name ${{ vars.ACR_NAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

