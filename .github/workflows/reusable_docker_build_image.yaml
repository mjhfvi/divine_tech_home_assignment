name: Reusable Dotnet Docker Image Build and Push to Azure Container Apps

on:
  push:
    # branches: [main]
  workflow_call:
    inputs:
      ACR_NAME:
        description: 'Azure Container Registry name (without .azurecr.io)'
        required: true
        type: string
      IMAGE_NAME:
        description: 'Docker image name'
        required: true
        type: string
      RESOURCE_GROUP:
        description: 'Azure Resource Group name'
        required: true
        type: string
      CONTAINER_APP_NAME:
        description: 'Azure Container App name'
        required: true
        type: string
    # outputs:
    #   image:
    #     description: 'The built image reference'
    #     value: ${{ jobs.build.outputs.image }}
  workflow_dispatch:

# Required for OIDC: lets the job request a GitHub-signed ID token
permissions:
  id-token: write
  contents: read

env:
  # Non-sensitive identifiers, set under Settings > Secrets and variables > Actions > Variables
  ACR_NAME: ${{ vars.ACR_NAME }}
  IMAGE_NAME: ${{ vars.IMAGE_NAME }}
  RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
  CONTAINER_APP_NAME: ${{ vars.CONTAINER_APP_NAME }}

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    # outputs:
    #   image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login - OIDC
        uses: azure/login@3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name ${{ vars.ACR_NAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Container Apps
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Azure login - OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Update Container App image
        uses: azure/cli@v2
        with:
          inlineScript: |
            az extension add --name containerapp --upgrade --only-show-errors
            az containerapp update \
              --name "$CONTAINER_APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --image "${{ needs.build.outputs.image }}"

      # - name: Show deployed URL
      #   uses: azure/cli@v2
      #   with:
      #     inlineScript: |
      #       fqdn=$(az containerapp show \
      #         --name "$CONTAINER_APP_NAME" \
      #         --resource-group "$RESOURCE_GROUP" \
      #         --query properties.configuration.ingress.fqdn -o tsv)
      #       echo "Deployed: https://${fqdn}"
